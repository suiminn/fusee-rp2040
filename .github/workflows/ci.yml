name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ARM Toolchain and Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib build-essential cmake python3

      - name: Run Python Tests
        run: python3 -m unittest discover -s tests

      - name: Configure CMake
        run: cmake -B build -DPICO_SDK_FETCH_FROM_GIT=on -DPICO_SDK_FETCH_FROM_GIT_TAG=2.2.0

      - name: Build
        env:
          GH_TOKEN: ${{ github.token }}
        run: cmake --build build --parallel

      - name: Report firmware size
        run: arm-none-eabi-size build/src/fusee.elf

      - name: Upload Firmware Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fusee-rp2040
          path: |
            build/src/fusee.uf2
            build/src/fusee.elf.map
