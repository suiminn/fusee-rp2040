name: Build RP2040 Fusee

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ARM Toolchain and Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib build-essential cmake python3

      - name: Configure CMake
        run: cmake -B build -DPICO_SDK_FETCH_FROM_GIT=on

      - name: Build
        run: cmake --build build

      - name: Upload UF2 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fusee-uf2
          path: build/src/fusee.uf2
